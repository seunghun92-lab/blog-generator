services:
  backend:
    build:
      context: ./backend
    container_name: blog-generator-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    container_name: blog-generator-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
