server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # docx 가이드 파일 + 여러 장 업로드를 고려해 업로드 제한을 넉넉히 잡음
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # "backend"는 로컬 docker-compose 네트워크에만 존재하는 호스트명.
    # 변수로 감싸서 요청 시점에만 DNS를 조회하도록 지연시켜야, backend 컨테이너가 없는
    # 환경(예: Render처럼 프론트/백엔드가 서로 다른 서비스로 분리된 배포)에서도
    # nginx가 시작 시점에 죽지 않는다. VITE_API_BASE_URL이 절대 URL로 설정된 배포에서는
    # 프론트가 이 경로를 아예 호출하지 않으므로 실제로 문제되지 않는다.
    resolver 127.0.0.11 valid=10s;
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
